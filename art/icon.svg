<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123B8C"/>
      <stop offset="1" stop-color="#0A1E4A"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <g id="ast">
      <line x1="0" y1="-38" x2="0" y2="38" stroke="#8FB6F5" stroke-width="22" stroke-linecap="round"/>
      <line x1="-33" y1="-19" x2="33" y2="19" stroke="#8FB6F5" stroke-width="22" stroke-linecap="round"/>
      <line x1="-33" y1="19" x2="33" y2="-19" stroke="#8FB6F5" stroke-width="22" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- Squircle 824x824 centré, marge macOS -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  </g>

  <circle cx="512" cy="512" r="248" fill="#FFFFFF" fill-opacity="0.07"
          stroke="#FFFFFF" stroke-width="36"/>

  <use href="#ast" transform="translate(642,382)"/>
  <use href="#ast" transform="translate(642,642)"/>
  <use href="#ast" transform="translate(382,642)"/>
  <use href="#ast" transform="translate(382,382)"/>

  <line x1="512" y1="512" x2="512" y2="328" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round"/>
  <line x1="512" y1="512" x2="374" y2="512" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round"/>
  <circle cx="512" cy="512" r="28" fill="#FFFFFF"/>
  <circle cx="512" cy="512" r="12" fill="#123B8C"/>
</svg>
